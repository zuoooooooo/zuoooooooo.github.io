<div class="research-list">
{% for paper in site.data.editorial_research %}
  <article class="research-item">
    <span class="paper-number" aria-hidden="true">0{{ forloop.index }}</span>
    <div class="paper-main"><span class="paper-tag{% if paper.label == 'ICML 2025' %} tag-orange{% endif %}">{{ paper.label }}</span><h3>{{ paper.title }}</h3><p class="paper-authors">{{ paper.authors }}</p><p class="paper-status">{{ paper.status }}</p></div>
    {% if paper.links.size > 0 %}<div class="paper-links">{% for link in paper.links %}<a href="{{ link.url }}">{{ link.title }} <span aria-hidden="true">↗</span></a>{% endfor %}</div>{% endif %}
  </article>
{% endfor %}
</div>
